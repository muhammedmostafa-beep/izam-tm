<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Result &amp; champions photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
body{margin:0}
a{color:#C8F04A}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #0B1410; color: #EEF3EC; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">

  <header style="flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px">
    <a href="#teams" aria-label="Back to Teams" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #27392F; background: #15231C; color: #EEF3EC; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase">Result</h1>
      <p style="margin: 3px 0 0; font-size: 13px; color: #A3B8AA">Week 12 · Thu 16 Oct · New Cairo Arena</p>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px">

    <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
      <legend style="padding: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em">Who won tonight?</legend>
      <div role="radiogroup" aria-label="Winning team" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px">
        <button type="button" role="radio" aria-checked="true" style="height: 52px; padding: 0 10px; border: 2px solid #C8F04A; border-radius: 12px; background: rgba(200, 240, 74, 0.12); color: #EEF3EC; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #C8F04A; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700">A</span>
          Lime
        </button>
        <button type="button" role="radio" aria-checked="false" style="height: 52px; padding: 0 10px; border: 1px solid #27392F; border-radius: 12px; background: #15231C; color: #EEF3EC; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #FF9F43; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700">B</span>
          Orange
        </button>
        <button type="button" role="radio" aria-checked="false" style="height: 52px; padding: 0 10px; border: 1px solid #27392F; border-radius: 12px; background: #15231C; color: #EEF3EC; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #7CC4FF; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700">C</span>
          Sky
        </button>
      </div>
    </fieldset>

    <section aria-label="Scoreline" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #15231C; border: 1px solid #27392F">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; color: #C8F04A">4/5</span>
        <span style="font-size: 14px; line-height: 1.3">Lime won<br><span style="color: #A3B8AA">4 of 5 games</span></span>
      </div>
      <ol role="list" aria-label="Games: won, won, lost, won, won" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 5px">
        <li style="width: 28px; height: 28px; border-radius: 8px; background: #C8F04A; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">W</li>
        <li style="width: 28px; height: 28px; border-radius: 8px; background: #C8F04A; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">W</li>
        <li style="width: 28px; height: 28px; border-radius: 8px; border: 1px solid #3D5446; box-sizing: border-box; color: #A3B8AA; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">L</li>
        <li style="width: 28px; height: 28px; border-radius: 8px; background: #C8F04A; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">W</li>
        <li style="width: 28px; height: 28px; border-radius: 8px; background: #C8F04A; color: #0B1410; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px">W</li>
      </ol>
    </section>

    <section aria-label="Winners' photo" style="position: relative; height: 128px; border-radius: 16px; overflow: hidden; background: #1C2E25; border: 1px solid #27392F">
      <svg width="100%" height="100%" viewBox="0 0 350 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Winners' photo placeholder" style="display: block">
        <defs>
          <pattern id="hatch-photo" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v12" stroke="#27392F" stroke-width="4"></path></pattern>
        </defs>
        <rect width="350" height="128" fill="url(#hatch-photo)"></rect>
        <g fill="#3D5446">
          <circle cx="95" cy="66" r="13"></circle><path d="M70 128c0-22 11-40 25-40s25 18 25 40z"></path>
          <circle cx="135" cy="58" r="14"></circle><path d="M108 128c0-26 12-46 27-46s27 20 27 46z"></path>
          <circle cx="175" cy="54" r="15"></circle><path d="M146 128c0-28 13-48 29-48s29 20 29 48z"></path>
          <circle cx="215" cy="58" r="14"></circle><path d="M188 128c0-26 12-46 27-46s27 20 27 46z"></path>
          <circle cx="255" cy="66" r="13"></circle><path d="M230 128c0-22 11-40 25-40s25 18 25 40z"></path>
        </g>
        <circle cx="175" cy="74" r="58" fill="none" stroke="#C8F04A" stroke-width="2" stroke-dasharray="6 5"></circle>
      </svg>
      <span style="position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #0B1410; color: #EEF3EC; font-size: 12px; font-weight: 700">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>
        Winners' photo
      </span>
      <button type="button" style="position: absolute; right: 8px; bottom: 8px; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #0B1410; color: #EEF3EC; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Change photo
      </button>
    </section>

    <section aria-label="Group icon preview" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg width="224" height="224" viewBox="0 0 240 240" role="img" aria-label="Circular group icon with frame text: Champions, Week 12, Team Lime" style="display: block">
        <defs>
          <pattern id="hatch-crop" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v12" stroke="#27392F" stroke-width="4"></path></pattern>
          <clipPath id="crop-clip"><circle cx="120" cy="120" r="90"></circle></clipPath>
          <path id="ring-path" d="M 16,120 A 104,104 0 1,1 224,120 A 104,104 0 1,1 16,120"></path>
        </defs>
        <circle cx="120" cy="120" r="117" fill="#C8F04A"></circle>
        <g clip-path="url(#crop-clip)">
          <rect x="30" y="30" width="180" height="180" fill="#1C2E25"></rect>
          <rect x="30" y="30" width="180" height="180" fill="url(#hatch-crop)"></rect>
          <g fill="#3D5446">
            <circle cx="72" cy="128" r="16"></circle><path d="M40 210c0-32 14-58 32-58s32 26 32 58z"></path>
            <circle cx="120" cy="112" r="19"></circle><path d="M82 210c0-38 17-70 38-70s38 32 38 70z"></path>
            <circle cx="168" cy="128" r="16"></circle><path d="M136 210c0-32 14-58 32-58s32 26 32 58z"></path>
          </g>
        </g>
        <circle cx="120" cy="120" r="91" fill="none" stroke="#0B1410" stroke-width="2"></circle>
        <text fill="#0B1410" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="15" letter-spacing="2.4"><textPath href="#ring-path" startOffset="0">CHAMPIONS · WEEK 12 · TEAM LIME · CHAMPIONS · WEEK 12 · TEAM LIME ·</textPath></text>
      </svg>
      <span style="font-size: 12px; color: #A3B8AA">Group icon preview · drag to reposition</span>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #C8F04A; color: #0B1410; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        Save &amp; share to group
      </button>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #A3B8AA; text-align: center">We'll save the icon to your photos and open the group so you can set it as the group picture.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
